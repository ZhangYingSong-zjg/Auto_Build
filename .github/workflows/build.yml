- name: Compile Java to .dex
  run: |
    mkdir -p classes
    javac -d classes TotpManager.java
    $ANDROID_HOME/build-tools/34.0.0/d8 --output output/ classes/com/pjy/totp/TotpManager.class
    # 核心修改：重命名为 totp.dex 防止打包冲突
    mv output/classes.dex output/totp.dex
    
- name: Upload Build Results
  uses: actions/upload-artifact@v4
  with:
    name: Totp-Build-Result
    path: |
      output/libtotp-lib.so
      output/totp.dex
