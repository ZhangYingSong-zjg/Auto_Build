name: Build Native And Dex
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Compile Java to .dex
      run: |
        mkdir -p classes output
        javac -d classes TotpManager.java
        $ANDROID_HOME/build-tools/34.0.0/d8 --output output/ classes/com/pjy/totp/TotpManager.class
        mv output/classes.dex output/totp.dex
        
    - name: Upload Build Results
      uses: actions/upload-artifact@v4
      with:
        name: Totp-Build-Result
        path: output/totp.dex
