name: Build Native And Dex
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile C++ to .so
      run: |
        mkdir -p output
        $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++ \
          -shared -fPIC -static-libstdc++ \
          -o output/libtotp-lib.so TotpBuild/totp.cpp
        
    - name: Compile Java to .dex
      run: |
        mkdir -p classes
        javac -d classes TotpBuild/TotpManager.java
        $ANDROID_HOME/build-tools/34.0.0/d8 --output output/ classes/com/pjy/totp/TotpManager.class
        
    - name: Upload Build Results
      uses: actions/upload-artifact@v4
      with:
        name: Totp-Build-Result
        path: |
          output/libtotp-lib.so
          output/classes.dex
